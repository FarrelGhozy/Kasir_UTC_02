services:
  # 1. Database MongoDB (wajib pakai autentikasi — lihat MONGO_ROOT_USER/PASSWORD di .env)
  mongo_db:
    image: mongo:8.2.11
    restart: always
    container_name: utc_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?Isi MONGO_ROOT_USER di file .env (lihat .env.example)}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Isi MONGO_ROOT_PASSWORD di file .env (lihat .env.example)}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-bengkel_utc}
    ports:
      # Bind ke localhost saja — database JANGAN terekspos ke jaringan/VPS publik.
      # (Akses dev lokal via mongodb://localhost:27018 tetap berfungsi.)
      - "127.0.0.1:${HOST_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - utc_network
    mem_limit: 512m
    cpus: 0.50
    # --- LIMITASI RESOURCE (Docker Swarm) ---
    deploy:
      resources:
        limits:
          cpus: '0.50'        # Maksimal pakai 50% dari 1 Core CPU
          memory: 512M        # Maksimal RAM fisik 512MB (Selebihnya masuk Swap)
        reservations:
          memory: 128M        # Garansi RAM minimal 128MB agar stabil
          

  # 2. Backend (Server API)
  backend:
    build: ./backend
    container_name: utc_backend
    restart: always
    ports:
      - "${HOST_BACKEND_PORT:-5200}:5000"
    # Seluruh konfigurasi dibaca dari file .env di ROOT project (single source of truth)
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5000}
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=${MONGODB_URI:?Isi MONGODB_URI di file .env (lihat .env.example)}
      - JWT_SECRET=${JWT_SECRET:?Isi JWT_SECRET di file .env (lihat .env.example)}
      - WAHA_URL=${WAHA_URL:?Isi WAHA_URL di file .env (lihat .env.example)}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - WAHA_API_KEY=${WAHA_API_KEY:?Isi WAHA_API_KEY di file .env (lihat .env.example)}
      - WAHA_WEBHOOK_SECRET=${WAHA_WEBHOOK_SECRET:-}
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      # Default dikosongkan agar backend memakai daftar origin aman bawaan.
      # JANGAN isi '*' di production (ditolak backend bila NODE_ENV=production).
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - IS_CAMPUS_EVENT=${IS_CAMPUS_EVENT:-false}
      - NOTA_VERIFY_URL=${NOTA_VERIFY_URL:-https://kasir.utc.web.id/verify.html}
    depends_on:
      - mongo_db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    networks:
      - utc_network
    mem_limit: 300m
    cpus: 0.50
    # --- LIMITASI RESOURCE (Docker Swarm) ---
    deploy:
      resources:
        limits:
          cpus: '0.50'        # Maksimal pakai 50% dari 1 Core CPU
          memory: 300M        # Node.js backend cukup ringan, 300MB cukup
        reservations:
          memory: 100M        # Garansi RAM minimal

  # 3. Frontend (Web Interface)
  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_PASS: http://backend:5000
    container_name: utc_frontend
    restart: always
    ports:
      - "${HOST_FRONTEND_PORT:-8080}:80"
    networks:
      - utc_network
    mem_limit: 128m
    cpus: 0.5
    # --- LIMITASI RESOURCE (Docker Swarm) ---
    deploy:
      resources:
        limits:
          cpus: '0.50'        # Frontend statis (Nginx) sangat ringan, 50% CPU cukup
          memory: 128M        # 128MB sangat cukup untuk serve file statis
        reservations:
          memory: 32M

  # 4. WAHA (WhatsApp HTTP API) — GOWS Engine
  waha:
    image: devlikeapro/waha:latest
    container_name: utc_waha
    restart: always
    ports:
      # Dashboard WAHA — akses via localhost + Tailscale tailnet.
      # OPSI A (aktif sekarang): bind langsung ke IP Tailscale via TAILSCALE_IP.
      #   Akses: http://<TAILSCALE_IP>:8000  (contoh: http://100.78.190.70:8000) dari device tailnet
      #   Jika IP Tailscale berubah (tailscale ip -4), update .env -> TAILSCALE_IP=<ip baru> lalu restart.
      # OPSI B (LEBIH AMAN, direkomendasikan untuk production): hapus baris TAILSCALE_IP di bawah,
      #   biarkan hanya 127.0.0.1, lalu di HOST jalankan:
      #     tailscale serve --bg http://127.0.0.1:8000
      #   atau dengan HTTPS MagicDNS:
      #     tailscale serve --bg --https=443 http://127.0.0.1:8000
      #   Akses jadi https://myserver.tail<id>.ts.net (enkripsi WireGuard + ACL Tailscale, tanpa buka port).
      - "127.0.0.1:${HOST_WAHA_PORT:-8000}:8000"
      - "${TAILSCALE_IP:-100.78.190.70}:${HOST_WAHA_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - WAHA_WHATSAPP_DEFAULT_SESSION=${WAHA_SESSION:-default}
      - WHATSAPP_START_SESSION=${WAHA_SESSION:-default}
      - WAHA_WHATSAPP_ENGINE=GOWS
      - WHATSAPP_HOOK_URL=http://backend:5000/api/waha-webhook
      - WHATSAPP_HOOK_EVENTS=message
      - WAHA_PRINT_QR=true
      - WAHA_API_KEY=${WAHA_API_KEY:?Isi WAHA_API_KEY di file .env (lihat .env.example)}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME:-admin-utc01}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD:?Isi WHATSAPP_SWAGGER_PASSWORD di file .env}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin-utc01}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:?Isi WAHA_DASHBOARD_PASSWORD di file .env}
    volumes:
      # Persistensi session WhatsApp agar tidak hilang saat container di-recreate
      - ./waha-sessions:/app/.sessions
    networks:
      - utc_network
    mem_limit: 1024m
    cpus: 1.0

  # 5. Restart berkala — JALANKAN DARI HOST, bukan dari container.
  #    Me-mount /var/run/docker.sock ke container = container yang dibobol bisa
  #    menguasai seluruh host Docker. Sebagai ganti, pasang cron di HOST/VPS:
  #      0 0 */2 * * docker restart utc_backend utc_waha
  #    (Service auto_restart berbasis docker.sock sengaja dihapus demi keamanan.)

networks:
  utc_network:
    driver: bridge

volumes:
  mongo_data: {}